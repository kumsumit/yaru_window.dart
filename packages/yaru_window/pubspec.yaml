name: yaru_window
description: Provides API for interacting with top-level windows.
repository: https://github.com/ubuntu/yaru_window.dart
issue_tracker: https://github.com/ubuntu/yaru_window.dart/issues
version: 0.2.2
publish_to: none

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  yaru_window_linux: 
    git: https://github.com/kumsumit/yaru_window_linux.git
  yaru_window_manager: 
    git: https://github.com/kumsumit/yaru_window_manager.git
  yaru_window_platform_interface: 
    git: https://github.com/kumsumit/yaru_window_platform_interface.git
  yaru_window_web: 
    git: https://github.com/kumsumit/yaru_window_web.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  plugin_platform_interface: 
    git: https://github.com/kumsumit/plugin_platform_interface.git
  ubuntu_lints: ^0.4.2

flutter:
  plugin:
    platforms:
      linux:
        default_package: yaru_window_linux
      macos:
        default_package: yaru_window_manager
      web:
        default_package: yaru_window_web
      windows:
        default_package: yaru_window_manager
